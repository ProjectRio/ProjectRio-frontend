<!-- @dsCard group="Colors" viewport="700x180" name="Rio Red" subtitle="The brand core — the mushroom cap. --rio-500 is primary." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 20px; }
	.row { display: flex; gap: 10px; }
	.sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-hairline); }
	.chip { height: 64px; }
	.meta { padding: 8px 10px; background: var(--surface-card); }
	.name { font-family: var(--font-display); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fog-100); }
	.hex { font-family: var(--font-mono); font-size: 11px; color: var(--fog-500); margin-top: 2px; }
</style>
</head>
<body>
	<div class="row">
		<div class="sw"><div class="chip" style="background:var(--rio-300)"></div><div class="meta"><div class="name">rio-300</div><div class="hex">#ff6b78</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--rio-400)"></div><div class="meta"><div class="name">rio-400</div><div class="hex">#ff3d4e</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--rio-500)"></div><div class="meta"><div class="name">rio-500</div><div class="hex">#e60012</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--rio-600)"></div><div class="meta"><div class="name">rio-600</div><div class="hex">#c4000f</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--rio-700)"></div><div class="meta"><div class="name">rio-700</div><div class="hex">#9a000c</div></div></div>
	</div>
</body>
</html>
