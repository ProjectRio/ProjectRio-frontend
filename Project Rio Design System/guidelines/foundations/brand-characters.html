<!-- @dsCard group="Brand" viewport="700x160" name="Character Sprites" subtitle="Roster portrait PNGs — pixelated, never scaled with blur." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
	figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
	img { width: 52px; height: 52px; object-fit: contain; image-rendering: pixelated; background: var(--surface-raised); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); padding: 2px; }
	figcaption { font-family: var(--font-mono); font-size: 10px; color: var(--fog-500); }
</style>
</head>
<body>
	<figure><img src="../../assets/characters/Mario.png" alt="Mario" /><figcaption>Mario</figcaption></figure>
	<figure><img src="../../assets/characters/Luigi.png" alt="Luigi" /><figcaption>Luigi</figcaption></figure>
	<figure><img src="../../assets/characters/Peach.png" alt="Peach" /><figcaption>Peach</figcaption></figure>
	<figure><img src="../../assets/characters/Daisy.png" alt="Daisy" /><figcaption>Daisy</figcaption></figure>
	<figure><img src="../../assets/characters/Yoshi.png" alt="Yoshi" /><figcaption>Yoshi</figcaption></figure>
	<figure><img src="../../assets/characters/DK.png" alt="DK" /><figcaption>DK</figcaption></figure>
	<figure><img src="../../assets/characters/Diddy.png" alt="Diddy" /><figcaption>Diddy</figcaption></figure>
	<figure><img src="../../assets/characters/Bowser.png" alt="Bowser" /><figcaption>Bowser</figcaption></figure>
	<figure><img src="../../assets/characters/Wario.png" alt="Wario" /><figcaption>Wario</figcaption></figure>
	<figure><img src="../../assets/characters/Boo.png" alt="Boo" /><figcaption>Boo</figcaption></figure>
</body>
</html>
