<!-- @dsCard group="Colors" viewport="700x180" name="Night Scale" subtitle="Dark arena backgrounds — page base through panel borders." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 20px; }
	.row { display: flex; gap: 10px; }
	.sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-strong); }
	.chip { height: 64px; }
	.meta { padding: 8px 10px; background: var(--surface-card); }
	.name { font-family: var(--font-display); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fog-100); }
	.hex { font-family: var(--font-mono); font-size: 11px; color: var(--fog-500); margin-top: 2px; }
</style>
</head>
<body>
	<div class="row">
		<div class="sw"><div class="chip" style="background:var(--night-950)"></div><div class="meta"><div class="name">night-950</div><div class="hex">#07070b</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--night-900)"></div><div class="meta"><div class="name">night-900</div><div class="hex">#0b0b12</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--night-850)"></div><div class="meta"><div class="name">night-850</div><div class="hex">#10101a</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--night-800)"></div><div class="meta"><div class="name">night-800</div><div class="hex">#161624</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--night-700)"></div><div class="meta"><div class="name">night-700</div><div class="hex">#1f1f30</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--night-600)"></div><div class="meta"><div class="name">night-600</div><div class="hex">#2b2b40</div></div></div>
	</div>
</body>
</html>
