<!-- @dsCard group="Colors" viewport="700x170" name="Fog Text & Accents" subtitle="Text on night, plus star gold and emerald win signal." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 20px; }
	.row { display: flex; gap: 10px; }
	.sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-hairline); }
	.chip { height: 56px; }
	.meta { padding: 8px 10px; background: var(--surface-card); }
	.name { font-family: var(--font-display); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fog-100); }
	.hex { font-family: var(--font-mono); font-size: 11px; color: var(--fog-500); margin-top: 2px; }
</style>
</head>
<body>
	<div class="row">
		<div class="sw"><div class="chip" style="background:var(--fog-100)"></div><div class="meta"><div class="name">fog-100</div><div class="hex">#f5f5f8</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--fog-300)"></div><div class="meta"><div class="name">fog-300</div><div class="hex">#c9c9d6</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--fog-500)"></div><div class="meta"><div class="name">fog-500</div><div class="hex">#8f8fa3</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--star-500)"></div><div class="meta"><div class="name">star-500</div><div class="hex">#f5bb00</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--star-400)"></div><div class="meta"><div class="name">star-400</div><div class="hex">#ffd23f</div></div></div>
		<div class="sw"><div class="chip" style="background:var(--emerald-400)"></div><div class="meta"><div class="name">emerald-400</div><div class="hex">#34d399</div></div></div>
	</div>
</body>
</html>
