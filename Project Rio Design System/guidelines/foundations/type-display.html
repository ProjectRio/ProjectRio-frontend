<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 22px; }
	.stack { display: flex; flex-direction: column; gap: 6px; }
	.d { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--fog-100); line-height: 1.05; }
	.note { font-family: var(--font-mono); font-size: 11px; color: var(--fog-500); }
</style>
</head>
<body>
	<div class="stack">
		<div class="d" style="font-size:48px">Superstar Baseball</div>
		<div class="note">--text-5xl · 700 · uppercase</div>
		<div class="d" style="font-size:30px;color:var(--rio-500)">Ranked Ladders</div>
		<div class="note">--text-3xl · 700 · rio-500</div>
		<div class="d" style="font-size:18px;color:var(--fog-300)">Box Score</div>
		<div class="note">--text-lg · 700</div>
	</div>
</body>
</html>
