<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base grid — gaps, padding, and stack rhythm." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 22px; display: flex; flex-direction: column; gap: 9px; }
	.r { display: flex; align-items: center; gap: 12px; }
	.bar { height: 14px; background: var(--rio-500); border-radius: 2px; }
	.t { font-family: var(--font-mono); font-size: 11px; color: var(--fog-500); width: 130px; }
</style>
</head>
<body>
	<div class="r"><span class="t">--space-1 · 4px</span><div class="bar" style="width:4px"></div></div>
	<div class="r"><span class="t">--space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
	<div class="r"><span class="t">--space-3 · 12px</span><div class="bar" style="width:12px"></div></div>
	<div class="r"><span class="t">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
	<div class="r"><span class="t">--space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
	<div class="r"><span class="t">--space-8 · 32px</span><div class="bar" style="width:32px"></div></div>
	<div class="r"><span class="t">--space-12 · 48px</span><div class="bar" style="width:48px"></div></div>
	<div class="r"><span class="t">--space-16 · 64px</span><div class="bar" style="width:64px"></div></div>
</body>
</html>
