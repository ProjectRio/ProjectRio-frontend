<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
	body { margin: 0; padding: 24px; }
	.grid { display: flex; flex-direction: column; gap: 22px; }
	.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
	.sec { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--fog-500); margin-bottom: 10px; }
</style>
</head>
<body>
	<div id="root"></div>
	<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
	<script src="../../_ds_bundle.js"></script>
	<script type="text/babel">
		const { Button, Badge, TierBadge, Input, Select, Avatar, LiveLabel, Panel, PanelHeader } = window.ProjectRioDesignSystem_6fbb66;
		function Demo() {
			return (
				<div className="grid">
					<div>
						<div className="sec">Buttons</div>
						<div className="row">
							<Button>Get Project Rio</Button>
							<Button variant="secondary">View Ladders</Button>
							<Button icon="../../assets/icons/baseball-bat.png" size="lg">Play Online</Button>
							<Button size="sm" variant="secondary">Log In</Button>
						</div>
					</div>
					<div>
						<div className="sec">Badges &amp; Tiers</div>
						<div className="row">
							<Badge color="red">Big Balls Brawl</Badge>
							<Badge color="gold">Official</Badge>
							<Badge color="gray">Unofficial</Badge>
							<Badge color="green">+18 ELO</Badge>
							<TierBadge tier="Legend I" />
							<TierBadge rating={1240} />
							<TierBadge rating={720} />
						</div>
					</div>
					<div>
						<div className="sec">Inputs</div>
						<div className="row" style={{ alignItems: 'flex-end' }}>
							<div style={{ width: 200 }}><Input label="Username" placeholder="Enter your tag" /></div>
							<div style={{ width: 180 }}><Select label="Mode" defaultValue="Standard"><option>Standard</option><option>Big Balls Brawl</option></Select></div>
						</div>
					</div>
					<div>
						<div className="sec">Avatars &amp; Live</div>
						<div className="row">
							<Avatar name="DingerCity" />
							<Avatar name="Mario" src="../../assets/characters/Mario.png" size={40} />
							<Avatar name="Peach" src="../../assets/characters/Peach.png" size={40} />
							<LiveLabel>Live — Top 5</LiveLabel>
						</div>
					</div>
					<Panel glow>
						<PanelHeader title="Recent Games" action={<span className="kicker">All →</span>} />
						<div style={{ padding: '14px 16px', fontSize: 13, color: 'var(--fog-300)' }}>
							The standard card surface — hover to see the red panel glow.
						</div>
					</Panel>
				</div>
			);
		}
		ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
	</script>
</body>
</html>
